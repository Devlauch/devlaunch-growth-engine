# Chatwoot service fragment — NOT wired into the real docker-compose.yml
# by this change (per instructions, that file is edited by a human
# reviewer, not this agent). This is the exact YAML to merge into the
# `services:` block of the repo-root docker-compose.yml once reviewed.
#
# Modeled on the `crawl4ai` service's profile-gating pattern there
# (profiles: ["crawl4ai"], no default on secrets, healthcheck against the
# container's own loopback) and on Chatwoot's own
# docker-compose.production.yaml in the reference clone
# (~/project/Growth/chatwoot/docker-compose.production.yaml, read-only,
# never modified): Chatwoot genuinely needs its own Postgres AND Redis
# (rails/sidekiq both `depends_on: [postgres, redis]` there) — these are
# NOT the platform's own `postgres`/`redis` services, to avoid mixing
# Chatwoot's schema/keyspace into devlaunch's own database and Redis
# instance.
#
# To start ONLY these services once reviewed and merged:
#   docker compose --profile chatwoot up -d chatwoot chatwoot-postgres chatwoot-redis chatwoot-sidekiq
#
# Required env vars (set in the root .env, none defaulted on purpose —
# same convention as CRAWL4AI_API_TOKEN above):
#   CHATWOOT_POSTGRES_PASSWORD   — Chatwoot's own Postgres password.
#   CHATWOOT_REDIS_PASSWORD      — Chatwoot's own Redis password.
#   CHATWOOT_SECRET_KEY_BASE     — Rails secret_key_base (generate with
#                                  `openssl rand -hex 64`).
#   CHATWOOT_FRONTEND_URL        — public URL Chatwoot is reached at
#                                  (used for links it generates, e.g. in
#                                  outgoing email/notifications).
#
# Once running, register an AgentBot in Chatwoot's admin UI with
# outgoing_url = https://<this-platform's-api-host>/api/v1/webhooks/chatwoot/<tenantId>/<projectId>
# and copy its secret into this platform's CHATWOOT_WEBHOOK_SECRET env var
# (see apps/api/src/config/env.ts / apps/api/src/routes/chatwootWebhooks.ts).

  chatwoot:
    image: chatwoot/chatwoot:latest
    profiles: ["chatwoot"]
    restart: unless-stopped
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE must be set}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3100}
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?CHATWOOT_POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:?CHATWOOT_REDIS_PASSWORD must be set}@chatwoot-redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "${CHATWOOT_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    profiles: ["chatwoot"]
    restart: unless-stopped
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE must be set}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3100}
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?CHATWOOT_POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD:?CHATWOOT_REDIS_PASSWORD must be set}@chatwoot-redis:6379
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # Chatwoot's OWN Postgres — deliberately separate from the platform's
  # `postgres` service (see header comment). pgvector/pgvector:pg16 matches
  # Chatwoot's own docker-compose.production.yaml exactly (it uses pgvector
  # extensions for some features) rather than a plain postgres image.
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["chatwoot"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?CHATWOOT_POSTGRES_PASSWORD must be set}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chatwoot's OWN Redis — deliberately separate from the platform's
  # `redis` service (see header comment), password-protected to match
  # Chatwoot's own docker-compose.production.yaml.
  chatwoot-redis:
    image: redis:alpine
    profiles: ["chatwoot"]
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$CHATWOOT_REDIS_PASSWORD\""]
    environment:
      CHATWOOT_REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?CHATWOOT_REDIS_PASSWORD must be set}
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CHATWOOT_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

# Add these two volumes to the root docker-compose.yml's top-level
# `volumes:` block alongside devlaunch_postgres_data etc.
#
# volumes:
#   chatwoot_postgres_data:
#   chatwoot_redis_data:
