name: devlaunch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devlaunch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlaunch}
      POSTGRES_DB: ${POSTGRES_DB:-devlaunch_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devlaunch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devlaunch} -d ${POSTGRES_DB:-devlaunch_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - devlaunch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Milestone 3 Phase 1 fix: the api/worker services connect as the real,
      # non-superuser `devlaunch_app` role (packages/db/migrations/
      # 321_create_app_role.sql) — NOT as POSTGRES_USER, which is the
      # Postgres Docker image's bootstrap superuser (rolsuper=true,
      # rolbypassrls=true). Postgres unconditionally bypasses RLS for
      # superusers, so every prior "FORCE ROW LEVEL SECURITY" migration
      # comment's safety claim was never actually enforced for this app's
      # own connection until this change. See docs/SECURITY_REVIEW.md's
      # "RLS bypass" entry for the full writeup. POSTGRES_USER/PASSWORD
      # remain the migration-running/table-owning role (packages/db's
      # `npm run migrate:up`, invoked separately, still needs that).
      DATABASE_URL: postgres://${APP_DB_USER:-devlaunch_app}:${APP_DB_PASSWORD:-devlaunch_app_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-devlaunch_dev}
      REDIS_URL: redis://redis:6379
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-insecure-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-insecure-refresh-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Client PDF reports: no S3/object storage is configured in this
      # environment, so generated report PDFs live on this local volume
      # (shared with the worker service below, which is the only thing
      # that writes into it — apps/api only reads, via the authenticated
      # GET .../reports/:id/download route).
      REPORT_FILES_DIR: /data/report_files
      # Integrations (Milestone 2 shared foundation, apps/api/src/lib/
      # credentialEncryption.ts) — AES-256-GCM key protecting every
      # listmonk/chatwoot/postiz credential stored in integrations.
      # encrypted_credential_ref. Left blank (no insecure fallback, unlike
      # the JWT dev secrets above) rather than ever defaulting to a value
      # that would let a real third-party secret be "encrypted" with a
      # known key.
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:-}
      # Chatwoot (apps/api/src/lib/chatwootClient.ts / chatwootWebhooks.ts):
      # single-shared-instance env-var fallback, used only when a tenant/
      # project hasn't connected its own per-tenant credential yet (see
      # .env.chatwoot.example's own doc comment). `chatwoot` below is this
      # compose project's own service name on the shared `devlaunch_default`
      # network, reachable from the api container when the chatwoot
      # profile is also up.
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-http://chatwoot:3000}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - devlaunch_report_files:/data/report_files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # See the `api` service's own comment above — same non-superuser
      # devlaunch_app role, same reasoning.
      DATABASE_URL: postgres://${APP_DB_USER:-devlaunch_app}:${APP_DB_PASSWORD:-devlaunch_app_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-devlaunch_dev}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only set/used if the optional `crawl4ai` profile service (below) is
      # explicitly enabled with `--profile crawl4ai`. The worker does not
      # require this to start or to run the market-research agent (which
      # uses MockResearchAdapter by default) or the discovery connectors
      # (which use the free PublicDirectoryConnector, not this service).
      # Verified 2026-11-21 against a live unclecode/crawl4ai:0.9.6
      # container (see docs/CRAWL4AI_VERIFICATION.md): that service also
      # requires CRAWL4AI_API_TOKEN (same value as the crawl4ai service
      # below) to be passed to HttpCrawl4AIBackend's apiToken option —
      # without it, /crawl returns 401 for every request.
      CRAWL4AI_BASE_URL: ${CRAWL4AI_BASE_URL:-}
      # Client PDF reports: this is the service that actually generates and
      # writes the PDF files (apps/worker/src/reports/), onto the same
      # shared volume apps/api reads from. See the `api` service above for
      # why this is a local volume and not S3/object storage.
      REPORT_FILES_DIR: /data/report_files
      # Hourly by default (see apps/worker/src/reports/scheduleLoop.ts);
      # overridable for faster local testing.
      REPORT_SCHEDULE_LOOP_INTERVAL_MS: ${REPORT_SCHEDULE_LOOP_INTERVAL_MS:-3600000}
    volumes:
      - devlaunch_report_files:/data/report_files
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # OPT-IN ONLY, not started by a plain `docker compose up`. Website-crawling
  # backend for Crawl4AIResearchAdapter (see
  # apps/worker/src/agents/researchAdapter.ts and ./websiteCrawler.ts) — not
  # used by anything enabled by default (market-research uses
  # MockResearchAdapter; lead discovery uses the free PublicDirectoryConnector,
  # not this). Pulls an external image (unclecode/crawl4ai) on first use.
  #
  # Verified 2026-11-21 against a real running container (see
  # docs/CRAWL4AI_VERIFICATION.md for the full session):
  #   - Image tag pinned to `0.9.6` (was `:latest`) — confirmed this tag
  #     resolves to the exact digest `:latest` pulled during verification.
  #   - `/health` is the correct healthcheck path and does return 200 with
  #     `{"status":"ok",...}` once the service is actually reachable.
  #   - IMPORTANT: this image's entrypoint binds the API to the
  #     CONTAINER's own loopback (127.0.0.1) ONLY unless CRAWL4AI_API_TOKEN
  #     is set at container start — with no token, the `ports:` mapping
  #     below is a no-op (the host and every other container get
  #     "connection refused"/"connection reset", and the container still
  #     reports itself healthy because its *internal* healthcheck curls its
  #     own loopback). Set CRAWL4AI_API_TOKEN (e.g. in a local .env; no
  #     default is baked in here on purpose) before relying on this
  #     service from outside its own container.
  #   - Once reachable, `/crawl` itself ALSO requires
  #     `Authorization: Bearer <CRAWL4AI_API_TOKEN>` (401
  #     `{"detail":"Authentication required"}` otherwise) — see
  #     HttpCrawl4AIBackend in apps/worker/src/agents/websiteCrawler.ts,
  #     which now sends this header when its apiToken option (or the
  #     CRAWL4AI_API_TOKEN env var) is set.
  # To start ONLY this service once you've decided to use it:
  #   CRAWL4AI_API_TOKEN=<your-token> docker compose --profile crawl4ai up -d crawl4ai
  crawl4ai:
    image: unclecode/crawl4ai:0.9.6
    profiles: ["crawl4ai"]
    restart: unless-stopped
    environment:
      # No default on purpose: see the loopback-bind note above — an
      # operator must consciously set this before exposing the service.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    ports:
      - "${CRAWL4AI_PORT:-11235}:11235"
    healthcheck:
      # This image is Python-based (no `node` binary), unlike the other
      # services' Node healthchecks above — use curl instead. Note this
      # healthcheck runs *inside* the container against its own loopback,
      # so it reports healthy even when CRAWL4AI_API_TOKEN is unset and the
      # service is unreachable from outside — healthy here is necessary,
      # not sufficient; see the note above.
      test: ["CMD-SHELL", "curl -f http://localhost:11235/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # React + TypeScript dashboard UI (see apps/dashboard), served as a
  # static build. VITE_API_BASE_URL is baked in at build time, so it
  # points at wherever the browser (not this container) can reach apps/api.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  devlaunch_postgres_data:
  devlaunch_redis_data:
  # Client PDF reports (see apps/worker/src/reports/reportFileStore.ts and
  # apps/api/src/routes/reports.ts). No S3/object storage is configured in
  # this environment, so generated PDFs live here instead, shared between
  # the api and worker services.
  devlaunch_report_files:
