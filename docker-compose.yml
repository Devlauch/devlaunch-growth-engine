name: devlaunch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devlaunch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlaunch}
      POSTGRES_DB: ${POSTGRES_DB:-devlaunch_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devlaunch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devlaunch} -d ${POSTGRES_DB:-devlaunch_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - devlaunch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-devlaunch}:${POSTGRES_PASSWORD:-devlaunch}@postgres:5432/${POSTGRES_DB:-devlaunch_dev}
      REDIS_URL: redis://redis:6379
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-insecure-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-insecure-refresh-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-devlaunch}:${POSTGRES_PASSWORD:-devlaunch}@postgres:5432/${POSTGRES_DB:-devlaunch_dev}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only set/used if the optional `crawl4ai` profile service (below) is
      # explicitly enabled with `--profile crawl4ai`. The worker does not
      # require this to start or to run the market-research agent (which
      # uses MockResearchAdapter by default) or the discovery connectors
      # (which use the free PublicDirectoryConnector, not this service).
      CRAWL4AI_BASE_URL: ${CRAWL4AI_BASE_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # OPT-IN ONLY, not started by a plain `docker compose up`. Website-crawling
  # backend for Crawl4AIResearchAdapter (see
  # apps/worker/src/agents/researchAdapter.ts and ./websiteCrawler.ts) — not
  # used by anything enabled by default (market-research uses
  # MockResearchAdapter; lead discovery uses the free PublicDirectoryConnector,
  # not this). Pulls an external image (unclecode/crawl4ai) on first use.
  # Image tag NOT independently verified against the published registry —
  # pin to a specific verified version before relying on this for anything
  # real (this uses :latest only as a placeholder).
  # To start ONLY this service once you've decided to use it:
  #   docker compose --profile crawl4ai up -d crawl4ai
  crawl4ai:
    image: unclecode/crawl4ai:latest
    profiles: ["crawl4ai"]
    restart: unless-stopped
    ports:
      - "${CRAWL4AI_PORT:-11235}:11235"
    healthcheck:
      # This image is Python-based (no `node` binary), unlike the other
      # services' Node healthchecks above — use curl instead.
      test: ["CMD-SHELL", "curl -f http://localhost:11235/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # React + TypeScript dashboard UI (see apps/dashboard), served as a
  # static build. VITE_API_BASE_URL is baked in at build time, so it
  # points at wherever the browser (not this container) can reach apps/api.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  devlaunch_postgres_data:
  devlaunch_redis_data:
